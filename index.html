<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lã Quốc Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #FFE8B8;
    --sky-bottom: #FFC6E0;
    --plum: #4B2E6F;
    --pink: #FF6FA0;
    --teal: #38C7B6;
    --yellow: #FFC93C;
    --lilac: #B79CED;
    --white: #FFFDF8;
    --shadow: rgba(75, 46, 111, 0.25);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
  }

  body{
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%, #FFB6D9 100%);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* soft ground blob */
  .ground{
    position:absolute;
    bottom:-10%;
    left:50%;
    transform:translateX(-50%);
    width:140%;
    height:40%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 70%);
    filter: blur(2px);
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- Floating doodles ---- */
  .doodle{
    position:absolute;
    filter: drop-shadow(0 6px 10px var(--shadow));
    animation: bob 6s ease-in-out infinite;
    transform-origin:center;
    cursor:pointer;
    transition: transform .25s ease;
  }
  .doodle:hover{ transform: scale(1.18) rotate(8deg) !important; }

  @keyframes bob{
    0%, 100%{ transform: translateY(0px) rotate(var(--r, 0deg)); }
    50%{ transform: translateY(-18px) rotate(calc(var(--r, 0deg) + 6deg)); }
  }

  .d1{ top:12%; left:10%; width:70px; --r:-8deg; animation-duration:5.5s; }
  .d2{ top:20%; right:12%; width:60px; --r:10deg; animation-duration:6.5s; animation-delay:.4s; }
  .d3{ bottom:18%; left:8%; width:64px; --r:6deg; animation-duration:5.8s; animation-delay:.8s; }
  .d4{ bottom:14%; right:9%; width:78px; --r:-6deg; animation-duration:6.2s; animation-delay:.2s; }
  .d5{ top:8%; left:44%; width:46px; --r:0deg; animation-duration:5s; animation-delay:1.1s; }
  .d6{ bottom:32%; right:22%; width:40px; --r:12deg; animation-duration:7s; animation-delay:.6s; }
  .d7{ top:38%; left:4%; width:36px; --r:-14deg; animation-duration:6.8s; animation-delay:1.4s; }
  .d8{ top:34%; right:5%; width:44px; --r:8deg; animation-duration:5.3s; animation-delay:.9s; }

  /* ---- Center card ---- */
  .content{
    position:relative;
    z-index:5;
    text-align:center;
    padding: 40px 30px;
    user-select:none;
  }

  .eyebrow{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    letter-spacing: 4px;
    text-transform:uppercase;
    color: var(--plum);
    opacity:.65;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .wiggle-wrap{
    display:inline-block;
    position:relative;
  }

  h1{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size: clamp(2.6rem, 9vw, 6rem);
    color: var(--plum);
    margin:0;
    line-height:1;
    cursor:pointer;
    letter-spacing: 1px;
    text-shadow: 4px 6px 0px rgba(255,255,255,0.6);
    transition: transform .15s ease;
    animation: pop-in .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  h1:active{ transform: scale(0.96); }

  @keyframes pop-in{
    0%{ transform: scale(0.4) rotate(-8deg); opacity:0; }
    100%{ transform: scale(1) rotate(0deg); opacity:1; }
  }

  .name-part{
    display:inline-block;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), color .25s ease;
  }
  h1:hover .name-part{ animation: wiggle-letters .6s ease; }

  @keyframes wiggle-letters{
    0%,100%{ transform: translateY(0) rotate(0); }
    25%{ transform: translateY(-10px) rotate(-4deg); }
    50%{ transform: translateY(2px) rotate(3deg); }
    75%{ transform: translateY(-6px) rotate(-2deg); }
  }

  .underline{
    display:block;
    margin: 14px auto 0;
    width: 62%;
  }
  .underline path{
    stroke: var(--pink);
    stroke-width: 8;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw 1s ease .5s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .tagline{
    margin-top: 22px;
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    font-weight: 600;
    color: var(--plum);
    opacity:0;
    animation: fade-up .7s ease 1.1s forwards;
  }

  @keyframes fade-up{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .hint{
    margin-top: 30px;
    font-size: 13px;
    font-weight:600;
    color: var(--plum);
    opacity:0;
    animation: fade-up .7s ease 1.4s forwards;
  }
  .hint span{
    display:inline-block;
    animation: point 1.6s ease-in-out infinite;
  }
  @keyframes point{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(4px); }
  }

  /* confetti */
  .confetti{
    position:fixed;
    top:0; left:0;
    width:10px; height:14px;
    border-radius:2px;
    pointer-events:none;
    z-index:50;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(100vh) rotate(720deg); opacity:0; }
  }

  @media (max-width: 600px){
    .doodle{ opacity:.85; }
    .d1{ width:50px; } .d2{ width:44px; } .d3{ width:46px; } .d4{ width:56px; }
    .d5{ width:34px; } .d6{ width:30px; } .d7{ width:26px; } .d8{ width:32px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition:none !important; }
  }

  .made{
    position:absolute;
    bottom: 18px;
    left:0; right:0;
    text-align:center;
    font-size:11px;
    color: var(--plum);
    opacity:.45;
    font-weight:600;
    letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="ground"></div>

  <!-- Floating doodles (inline SVG, no external images) -->
  <svg class="doodle d1" viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 24 L43 37 L49 58 L32 45 L15 58 L21 37 L4 24 L25 24 Z" fill="var(--yellow)"/></svg>

  <svg class="doodle d2" viewBox="0 0 64 64"><path d="M32 56 C10 40 6 24 18 16 C26 10 32 16 32 16 C32 16 38 10 46 16 C58 24 54 40 32 56 Z" fill="var(--pink)"/></svg>

  <svg class="doodle d3" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="var(--teal)"/><circle cx="24" cy="26" r="4" fill="#fff"/><circle cx="42" cy="26" r="4" fill="#fff"/><path d="M20 40 Q32 50 44 40" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

  <svg class="doodle d4" viewBox="0 0 64 64"><path d="M12 46 Q12 20 32 12 Q52 20 52 46 Q32 40 12 46 Z" fill="var(--lilac)"/><circle cx="32" cy="30" r="5" fill="#fff" opacity=".6"/></svg>

  <svg class="doodle d5" viewBox="0 0 64 64"><path d="M32 8 C40 8 46 16 46 26 C46 40 32 56 32 56 C32 56 18 40 18 26 C18 16 24 8 32 8 Z" fill="var(--pink)"/></svg>

  <svg class="doodle d6" viewBox="0 0 64 64"><path d="M8 32 Q8 8 32 8 Q56 8 56 32 Q56 56 32 56 Q8 56 8 32 Z" fill="var(--yellow)"/><path d="M22 32 L28 40 L44 22" stroke="var(--plum)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <svg class="doodle d7" viewBox="0 0 64 64"><path d="M32 2 L38 26 L62 32 L38 38 L32 62 L26 38 L2 32 L26 26 Z" fill="var(--teal)"/></svg>

  <svg class="doodle d8" viewBox="0 0 64 64"><path d="M14 50 Q4 30 20 16 Q30 6 42 14 Q54 22 50 38 Q46 54 28 56 Q18 57 14 50 Z" fill="var(--lilac)"/></svg>

  <div class="content">
    <div class="eyebrow">Xin chào, mình là</div>
    <div class="wiggle-wrap">
      <h1 id="nameHeading" aria-label="Lã Quốc Anh">
        <span class="name-part">Lã</span> <span class="name-part">Quốc</span> <span class="name-part">Anh</span>
      </h1>
      <svg class="underline" viewBox="0 0 300 20" preserveAspectRatio="none">
        <path d="M5 12 Q75 2 150 12 T295 10"/>
      </svg>
    </div>
    <p class="tagline">Rất vui được gặp bạn ở đây! ✨</p>
    <p class="hint">Chạm/click vào tên hoặc mấy hình xinh xinh nha <span>👆</span></p>
  </div>

  <div class="made">made with 🎉 just for fun</div>
</div>

<script>
  const colors = ['#FF6FA0', '#FFC93C', '#38C7B6', '#B79CED', '#FFFDF8'];

  function burst(x, y, count){
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.transform = `translate(${(Math.random()-0.5)*40}px, 0) rotate(${Math.random()*360}deg)`;
      const dx = (Math.random()-0.5) * 260;
      const duration = 1.1 + Math.random()*0.9;
      c.style.animationDuration = duration + 's';
      c.style.setProperty('--dx', dx+'px');
      c.style.left = (x + dx*0.05) + 'px';
      document.body.appendChild(c);
      setTimeout(()=> c.remove(), duration*1000 + 100);
    }
  }

  function burstAt(el, count){
    const rect = el.getBoundingClientRect();
    burst(rect.left + rect.width/2, rect.top + rect.height/2, count);
  }

  document.getElementById('nameHeading').addEventListener('click', (e)=>{
    burst(e.clientX, e.clientY, 26);
  });

  document.querySelectorAll('.doodle').forEach(d=>{
    d.addEventListener('click', (e)=>{
      e.stopPropagation();
      burstAt(d, 14);
    });
  });

  // gentle parallax with mouse/touch
  const stage = document.getElementById('stage');
  const doodles = document.querySelectorAll('.doodle');
  window.addEventListener('mousemove', (e)=>{
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    const dx = (e.clientX - cx) / cx;
    const dy = (e.clientY - cy) / cy;
    doodles.forEach((d, i)=>{
      const depth = (i % 4 + 1) * 4;
      d.style.marginLeft = (dx * depth) + 'px';
      d.style.marginTop = (dy * depth) + 'px';
    });
  });

  // little welcome burst on load
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      burst(window.innerWidth/2, window.innerHeight*0.35, 20);
    }, 550);
  });
</script>

</body>
</html>
